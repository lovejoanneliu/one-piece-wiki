    header {

      align-items: center;
      gap: 12px;
    }

    .brand {

      align-items: center;
      gap: 10px;
    }

    .brand-seal {
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
      font-weight: 900;
      font-size: 11px;
      padding: 2px 8px;
      letter-spacing: 1.5px;
      border-radius: 4px;
    }

    .brand h1 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--text-main);
    }

    nav.tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;

    .tab-btn:hover { border-color: var(--accent-red); }

      border-color: var(--accent-red);
      color: #FFFFFF;
    }

    main {
      max-width: 1180px;
      margin: 28px auto 60px;
      padding: 0 24px;

    .stats-grid {

      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-paper);
      border: 1.5px solid var(--border-color);
      border-top: 4px solid var(--accent-gold);
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 4px 12px rgba(42, 27, 16, 0.05);

      font-weight: 900;
      color: var(--accent-red);
    }

    .stat-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .filter-bar {
      background: var(--bg-paper);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .search-input {
      flex: 1;
      min-width: 240px;
      padding: 8px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      background: #FFFDF8;
      font-size: 14px;
      color: var(--text-main);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-sub);
    }
    .tag-chip.active, .tag-chip:hover {
      background: var(--accent-gold);
      color: #FFFFFF;
      border-color: var(--accent-gold);
    }

    .workspace {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .entry-item {
      background: var(--bg-paper);
      border: 1.5px solid var(--border-color);
      border-left: 4px solid var(--accent-gold);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .entry-item:hover, .entry-item.selected {
      border-left-color: var(--accent-red);
      background: #FFFDF8;
      transform: translateX(3px);
    }

    .entry-cat {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent-red);
      letter-spacing: 1px;
    }

    .entry-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      margin: 4px 0;
    }

    .entry-meta {
      font-size: 12px;
      color: var(--text-sub);
    }

    .reader-pane {
      background: var(--bg-paper);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 28px 34px;
      box-shadow: 0 10px 28px rgba(42, 27, 16, 0.08);
      min-height: 480px;
    }

    .reader-header {
      border-bottom: 2px solid var(--accent-gold);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .reader-header h2 {
      font-family: var(--font-serif);
      font-size: 26px;
      margin-top: 6px;
    }

    .reader-body h3 {
      font-family: var(--font-serif);
      color: var(--accent-red);
      margin: 18px 0 8px;
      font-size: 19px;
    }

    .reader-body p, .reader-body li {
      margin-bottom: 10px;
      color: var(--text-sub);
      font-size: 15.5px;

    .reader-body ul { padding-left: 22px; }

    .formula-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      border-left: 4px solid var(--accent-red);
      padding: 14px 18px;
      border-radius: 8px;
      margin: 14px 0;
      text-align: center;

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 14px;
      background: var(--bg-card);

    th {
      border-top: 2px solid var(--text-main);
      border-bottom: 1.5px solid var(--text-main);
      padding: 8px 10px;
      text-align: left;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
    }
    tr:last-child td { border-bottom: 2px solid var(--text-main); }

    .action-link {
      display: inline-block;
      margin-top: 12px;
      background: var(--accent-red);
      color: #FFFFFF;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: var(--text-sub);
      border-top: 1px solid var(--border-color);
    }

</head>

  <script>

        summary: "嚴格基於現有 Wiki 館藏生成之 8 頁互動簡報，支援偉大航道羊皮紙／海軍白底／新世界暗黑三風格切換與 KaTeX 公式。",

      },
      {
        id: "deepseek-r1",
        category: "papers",
        categoryLabel: "PAPERS // 論文單篇精讀",
        title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via RL (2025)",
        tags: ["reasoning", "rl-alignment"],
        source: "raw/papers/2025-DeepSeek-R1.md",
        summary: "證明僅透過大規模強化學習（GRPO）搭配可驗證獎勵，無需大量 SFT 冷啟動即可湧現長思維鏈與自我反思。",
        html: `
          <h3>1. 核心突破與訓練管線</h3>
          <ul>
            <li><strong>DeepSeek-R1-Zero</strong>：直接對 DeepSeek-V3-Base 進行純 RL 訓練，模型自發延長 Test-Time Compute 並出現自我驗證（Aha Moment）。</li>
            <li><strong>DeepSeek-R1 四階段管線</strong>：少量 Long CoT 冷啟動 SFT &rarr; 面向推理的 GRPO RL &rarr; 拒絕採樣與通用 SFT &rarr; 全場景對齊 RL。</li>
            <li><strong>推理蒸餾（Distillation）</strong>：將 R1 推理軌跡蒸餾至 Qwen/Llama 小模型（1.5B–70B），效果遠勝小模型直接做純 RL。</li>
          </ul>
          <h3>2. 關鍵基準數據對比</h3>
          <table>
            <thead><tr><th>評測基準</th><th>OpenAI o1-1217</th><th>DeepSeek-R1</th><th>R1-Distill-Qwen-32B</th></tr></thead>
            <tbody>
              <tr><td>AIME 2024 (Pass@1)</td><td>79.2%</td><td><strong>79.8%</strong></td><td>72.6%</td></tr>

              <tr><td>SWE-bench Verified</td><td>48.9%</td><td><strong>49.2%</strong></td><td>43.9%</td></tr>

          </table>

      },
      {
        id: "grpo",
        category: "methods",
        categoryLabel: "METHODS // 核心技術與方法論",
        title: "Group Relative Policy Optimization (GRPO) 群組相對策略優化",
        tags: ["rl-alignment", "reasoning"],
        source: "wiki/methods/GRPO.md",
        summary: "移除傳統 PPO 的 Critic Value Model，改以同組採樣輸出的平均獎勵作為基線計算相對優勢，大幅節省顯存。",
        html: `
          <h3>1. 核心機制：移除 Critic Model</h3>
          <p>針對同一問題 $q$，從舊策略 $\\pi_{\\theta_{\\text{old}}}$ 採樣一組共 $G$ 個輸出 $\\{o_1, \\dots, o_G\\}$，直接以組內平均獎勵計算相對優勢：</p>
          <div class="formula-card">
            $$A_i = \\frac{r_i - \\text{mean}(\\{r_1, \\dots, r_G\\})}{\\text{std}(\\{r_1, \\dots, r_G\\})}$$
          </div>
          <h3>2. 目標函數</h3>
          <div class="formula-card">
            $$\\mathcal{J}_{\\text{GRPO}}(\\theta) = \\mathbb{E}\\left[ \\frac{1}{G} \\sum_{i=1}^{G} \\left( \\min\\left( \\frac{\\pi_\\theta(o_i|q)}{\\pi_{\\theta_{\\text{old}}}(o_i|q)} A_i, \\text{clip}(\\dots) A_i \\right) - \\beta \\mathbb{D}_{\\text{KL}}(\\pi_\\theta \\| \\pi_{\\text{ref}}) \\right) \\right]$$
          </div>

      {

        category: "architectures",
        categoryLabel: "ARCHITECTURES // 模型架構與家族",
        title: "Attention Is All You Need — Transformer 核心架構 (2017)",

        html: `

          <table>
            <thead><tr><th>模型架構</th><th>BLEU 分數</th><th>訓練算力 (FLOPs)</th></tr></thead>

        tags: ["rag-memory"],
        source: "wiki/papers/2020-Lewis-RAG.md",
        summary: "結合參數化記憶（Pre-trained Seq2Seq）與非參數化外部稠密向量索引，顯著降低幻覺並支持動態知識更新。",
        html: `
          <h3>1. 兩種核心架構變體</h3>
          <ul>
            <li><strong>RAG-Sequence</strong>：針對整段生成序列，檢索同一組 Top-$K$ 文件並計算邊際機率。</li>
            <li><strong>RAG-Token</strong>：在生成每一個 Token 時動態切換參考不同的 Top-$K$ 檢索文件。</li>

    document.addEventListener('DOMContentLoaded', function () {
      let activeCategory = 'all';
      let activeTag = 'all';
      let selectedId = wikiData[0].id;

      const searchInput = document.getElementById('searchInput');
      const listEl = document.getElementById('entryList');
      const pane = document.getElementById('readerPane');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          activeCategory = btn.getAttribute('data-cat');
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderList();
        });
      });

      document.querySelectorAll('.tag-chip').forEach(chip => {
        chip.addEventListener('click', function () {
          activeTag = chip.getAttribute('data-tag');
          document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          renderList();
        });
      });

      searchInput.addEventListener('input', renderList);

      function renderList() {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = wikiData.filter(item => {
          const matchCat = activeCategory === 'all' || item.category === activeCategory;
          const matchTag = activeTag === 'all' || item.tags.includes(activeTag);
          const matchQuery = !q || item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q);
          return matchCat && matchTag && matchQuery;
        });

        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="entry-item">找不到符合條件的知識條目，請嘗試其他關鍵字。</div>';
          return;
        }

        if (!filtered.some(i => i.id === selectedId)) {
          selectedId = filtered[0].id;
        }

        listEl.innerHTML = filtered.map(item => `
          <div class="entry-item ${item.id === selectedId ? 'selected' : ''}" data-id="${item.id}">
            <div class="entry-cat">${item.categoryLabel}</div>
            <div class="entry-title">${item.title}</div>
            <div class="entry-meta">${item.tags.map(t => '#' + t).join(' ')}</div>
          </div>
        `).join('');

        listEl.querySelectorAll('.entry-item[data-id]').forEach(el => {
          el.addEventListener('click', function () {
            selectedId = el.getAttribute('data-id');
            renderList();
          });
        });

        renderReader();
      }

      function renderReader() {
        const item = wikiData.find(i => i.id === selectedId) || wikiData[0];
        pane.innerHTML = `
          <div class="reader-header">
            <div class="entry-cat">${item.categoryLabel}</div>
            <h2>${item.title}</h2>
            <div class="entry-meta" style="margin-top:6px;">
              溯源路徑：<code>${item.source}</code> ｜ 標籤：${item.tags.map(t => '#' + t).join(' ')}
            </div>
          </div>
          <div class="reader-body">
            <p><strong>核心摘要：</strong>${item.summary}</p>
            ${item.html}
          </div>
        `;
        if (window.renderMathInElement) {
          renderMathInElement(pane, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false}
            ]
          });
        }
      }

      renderList();
    });
  </script>
</body>
</html>
